model_name_or_path: /Qwen2.5-7B-Instruct
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
pref_beta: 0.1

bf16: true
cutoff_len: 2048
max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 4

dataset_dir: /llamafactory_config/data
dataset: mgbie_train_sft
eval_dataset: mgbie_val_sft
template: qwen

output_dir: /outputs/llamafactory_qwen2_5_7b_lora_sft_1000_400
logging_steps: 10
save_steps: 100
plot_loss: false
overwrite_output_dir: true
save_only_model: false
report_to: none

per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03

val_size: 0.0
eval_strategy: epoch
save_strategy: epoch
